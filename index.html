<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="assets/icon.png" />
<title>Erro-404</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family: Arial, Helvetica, sans-serif;
    }

    body{
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        user-select: none;
        background: rgb(255, 255, 255);
        overflow:hidden;
    }
   .wrapper{
      position: absolute;
      width: 40%;
      background-color: purple;
      border-radius: 50%;
      top: 50%;
      left: 50%;
      filter: blur(80px);
      z-index: 1;
      
   }     

    .container{
        text-align:center;
        z-index: 2;
    }

    /* Número 404 animado */
    .error{
        font-size:120px;
        font-weight:bold;
        color:#9e4caf;
        position:relative;
        animation: flutuar 2s ease-in-out infinite;
    }
   
    h2{
        margin-top:10px;
        color:#612e7d;
    }

    p{
        margin-top:8px;
        color:#555;
    }

    /* Botão */
    .btn{
        margin-top:25px;
        display:inline-block;
        padding:12px 25px;
        background:#985fca;
        color:white;
        text-decoration:none;
        border-radius:8px;
        transition:0.3s;
        font-weight:bold;
    }

    .btn:hover{
        background:#814caf;
        transform:scale(1.05);
    }


</style>
</head>

<body>
<div class="wrapper"></div>
<div class="container">
    <div class="error">404</div>
    <h2>Página não encontrada</h2>
    <p>Ops! Ainda estou trabalhando nisso.</p>
    <a href="javascript:history.back()" class="btn"> Voltar </a>
</div>

</body>
</html>
