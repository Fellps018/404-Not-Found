<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="assets/icon.png" />
<title>Error-404</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family: Arial, Helvetica, sans-serif;
    }

    body{
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        user-select: none;
        background: rgb(240, 240, 240);
        overflow:hidden;
    }  

    .container{
        text-align:center;
        z-index: 2;
    }

    /* Número 404 animado */
    .error{
        font-size:120px;
        font-weight:bold;
        color:#741189;
        position:relative;
        animation: flutuar 2s ease-in-out infinite;
    }
   
    @keyframes flutuar {
        0%,100%{
            transform: translateY(0);
        }
        50%{
            transform: translateY(-15px);
        }
    }
   
    h2{
        margin-top:10px;
        color:#612e7d;
    }

    p{
        margin-top:8px;
        color:#555;
    }

    /* Botão */
    .btn{
        margin-top:25px;
        display:inline-block;
        padding:12px 25px;
        background:#000000;
        color:white;
        text-decoration:none;
        border-radius:16px;
        transition:0.3s;
        font-weight:bold;
    }

    .btn:hover{
        transform:scale(1.05);
    }
 @media (pointer: coarse) {
   .btn{
       cursor: none;
    }
}


</style>
</head>

<body>
<div class="container">
    <div class="error">404</div>
    <h2>Página não encontrada</h2>
    <p>Ops! Ainda estou trabalhando nisso.</p>
    <a href="javascript:history.back()" class="btn" 
       alt="Voltar para página anterior" title="Voltar para página anterior"> Voltar </a>
</div>

</body>
</html>
